<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KMP Explorer</title>
    <meta
      name="description"
      content="Interactive 45-minute lesson on the Knuth-Morris-Pratt algorithm."
    />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/problem.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow">Kalvium assessment</p>
        <h1>KMP Explorer</h1>
      </div>
      <div class="topbar-actions" aria-label="Lesson controls">
        <button type="button" id="previousModuleBtn" class="ghost-btn">Previous</button>
        <button type="button" id="nextModuleBtn" class="primary-btn">Next</button>
      </div>
    </header>

    <main class="lesson-shell" aria-label="KMP lesson">
      <nav class="progress" aria-label="Lesson progress">
        <div class="progress-track" role="list">
          <button type="button" class="progress-step is-active" data-step="0" role="listitem" aria-current="true">
            <span class="step-index">1</span>
            <span class="step-copy">Problem</span>
            <span class="step-time">5 min</span>
          </button>
          <button type="button" class="progress-step" data-step="1" role="listitem">
            <span class="step-index">2</span>
            <span class="step-copy">LPS</span>
            <span class="step-time">10 min</span>
          </button>
          <button type="button" class="progress-step" data-step="2" role="listitem">
            <span class="step-index">3</span>
            <span class="step-copy">Match</span>
            <span class="step-time">10 min</span>
          </button>
          <button type="button" class="progress-step" data-step="3" role="listitem">
            <span class="step-index">4</span>
            <span class="step-copy">Code</span>
            <span class="step-time">7 min</span>
          </button>
          <button type="button" class="progress-step" data-step="4" role="listitem">
            <span class="step-index">5</span>
            <span class="step-copy">Complexity</span>
            <span class="step-time">5 min</span>
          </button>
          <button type="button" class="progress-step" data-step="5" role="listitem">
            <span class="step-index">6</span>
            <span class="step-copy">Check</span>
            <span class="step-time">8 min</span>
          </button>
        </div>
      </nav>

      <section class="module-panel is-visible" id="module-1" aria-live="polite">
        <div class="module-header">
          <p class="module-kicker">Module 1</p>
          <h2>The problem</h2>
        </div>
        <div class="module-body" id="module-1-body"></div>
      </section>

      <section class="module-panel" id="module-2" aria-live="polite" hidden>
        <div class="module-header">
          <p class="module-kicker">Module 2</p>
          <h2>The LPS table</h2>
        </div>
        <div class="module-body" id="module-2-body"></div>
      </section>

      <section class="module-panel" id="module-3" aria-live="polite" hidden>
        <div class="module-header">
          <p class="module-kicker">Module 3</p>
          <h2>The matching phase</h2>
        </div>
        <div class="module-body" id="module-3-body"></div>
      </section>

      <section class="module-panel" id="module-4" aria-live="polite" hidden>
        <div class="module-header">
          <p class="module-kicker">Module 4</p>
          <h2>The code</h2>
        </div>
        <div class="module-body" id="module-4-body"></div>
      </section>

      <section class="module-panel" id="module-5" aria-live="polite" hidden>
        <div class="module-header">
          <p class="module-kicker">Module 5</p>
          <h2>Complexity</h2>
        </div>
        <div class="module-body" id="module-5-body"></div>
      </section>

      <section class="module-panel" id="module-6" aria-live="polite" hidden>
        <div class="module-header">
          <p class="module-kicker">Module 6</p>
          <h2>Check yourself</h2>
        </div>
        <div class="module-body" id="module-6-body"></div>
      </section>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
